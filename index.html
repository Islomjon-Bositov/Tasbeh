<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tasbih - digital tasbih counter with streak tracking, goal setting, dark mode, and daily habits."
    />
    <meta
      name="keywords"
      content="tasbih, digital counter, zikr, dhikr, prayer counter, streak tracker, islamic app"
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta property="og:title" content="Tasbih" />
    <meta
      property="og:description"
      content="Count your tasbih, track your streak, and stay focused on daily goals with a clean and fast counter app."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/src/assets/tasbih.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tasbih" />
    <meta
      name="twitter:description"
      content="Digital tasbih counter with streak tracking, goal setting, and daily habit stats."
    />
    <link rel="icon" type="image/png" href="/src/assets/tasbih.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Tasbih</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("tasbih_isDarkMode");
          const isDarkMode = saved === null ? true : saved === "true";
          const theme = isDarkMode ? "dark" : "light";
          const background = isDarkMode ? "#050d1b" : "#edf6ff";

          document.documentElement.style.colorScheme = theme;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.backgroundColor = background;

          if (document.body) {
            document.body.style.backgroundColor = background;
          }

          const themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute(
              "content",
              isDarkMode ? "#050d1b" : "#edf6ff",
            );
          }
        } catch (error) {
          document.documentElement.style.colorScheme = "dark";
          if (document.body) {
            document.body.style.backgroundColor = "#050d1b";
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
